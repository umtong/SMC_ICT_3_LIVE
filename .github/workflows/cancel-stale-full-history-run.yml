name: cancel-stale-full-history-run

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cancel-stale-full-history-run.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-history-market-data-v1
  cancel-in-progress: true

jobs:
  retire-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove one-shot cancellation gate
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          rm .github/workflows/cancel-stale-full-history-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "retire stale full-history cancellation gate"
          git push origin HEAD:main
