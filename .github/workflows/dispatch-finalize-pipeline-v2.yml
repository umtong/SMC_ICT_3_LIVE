name: dispatch-post-import-fix-final-pipeline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-finalize-pipeline-v2.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Dispatch and record a fresh validation run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run finalize-full-history-pipeline.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          for _ in $(seq 1 60); do
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow finalize-full-history-pipeline.yml \
              --limit 10 \
              --json databaseId,status,conclusion,headSha,url,createdAt,updatedAt,event \
              --jq 'map(select(.event == "workflow_dispatch")) | .[0] // empty' \
              > "$RUNNER_TEMP/run.json" || true
            if [[ -s "$RUNNER_TEMP/run.json" ]] && \
               [[ "$(jq -r '.createdAt' "$RUNNER_TEMP/run.json")" > "$before" ]]; then
              break
            fi
            sleep 5
          done
          test -s "$RUNNER_TEMP/run.json"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p data/distributions
          cp "$RUNNER_TEMP/run.json" data/distributions/finalize-pipeline.active-run.json
          rm -f \
            .github/workflows/dispatch-finalize-pipeline-v2.yml \
            .github/workflows/discover-finalize-run-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "record post-import-fix final pipeline run"
          git push origin HEAD:main
