name: publish-completed-full-history-index

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-completed-full-history-index.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-completed-full-history-index
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: "30733616464"
  SOURCE_COMMIT: "849251cebac7e1b8d302758061c8a401e16812b6"
  RELEASE_ID: full-history-v1.0.0
  RELEASE_TAG: market-data-full-history-v1.0.0
  STATUS_PATH: data/distributions/full-history-v1.0.0.published.json

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          pattern: partition-index-*
          path: manifests
          merge-multiple: true

      - name: Rebuild the pinned distribution index from all successful partitions
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          assets = [
              json.loads(path.read_text(encoding="utf-8"))
              for path in sorted(Path("manifests").glob("partition-index-*.json"))
          ]
          expected = [str(year) for year in range(2017, 2027)]
          actual = [asset["partition_id"] for asset in assets]
          if actual != expected:
              raise SystemExit(f"partition index mismatch: expected={expected}, actual={actual}")

          pipeline_versions = sorted({asset["pipeline_version"] for asset in assets})
          repository_commits = sorted({asset["repository_commit"] for asset in assets})
          if len(pipeline_versions) != 1:
              raise SystemExit(f"mixed pipeline versions: {pipeline_versions}")
          if repository_commits != [os.environ["SOURCE_COMMIT"]]:
              raise SystemExit(
                  f"partition commit mismatch: expected={os.environ['SOURCE_COMMIT']}, "
                  f"actual={repository_commits}"
              )

          index = {
              "schema_version": "1.0",
              "pipeline_version": pipeline_versions[0],
              "repository_commit": repository_commits[0],
              "release_id": os.environ["RELEASE_ID"],
              "tag": os.environ["RELEASE_TAG"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "status": "ready",
              "period_utc": "[2017-01-01, 2026-08-01)",
              "symbols": ["BTCUSDT", "ETHUSDT", "XRPUSDT", "SOLUSDT"],
              "source_datasets": [
                  "spot/klines",
                  "futures/um/klines",
                  "futures/um/markPriceKlines",
                  "futures/um/indexPriceKlines",
                  "futures/um/premiumIndexKlines",
              ],
              "base_interval": "1m",
              "timeframes": ["1m", "5m", "15m", "1h", "4h"],
              "assets": assets,
              "totals": {
                  "bytes": sum(int(asset["bytes"]) for asset in assets),
                  "files": {
                      "silver": sum(int(asset["files"]["silver"]) for asset in assets),
                      "gold": sum(int(asset["files"]["gold"]) for asset in assets),
                  },
                  "rows": {
                      "silver": sum(int(asset["rows"]["silver"]) for asset in assets),
                      "gold": sum(int(asset["rows"]["gold"]) for asset in assets),
                  },
              },
              "installation": {
                  "command": "smc-data install",
                  "destination": "data/installed/full-history-v1.0.0",
                  "external_market_data_download_required": False,
                  "google_drive_required": False,
              },
          }
          output = Path("full-history-v1.0.0.index.json")
          output.write_text(json.dumps(index, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          checksum = hashlib.sha256(output.read_bytes()).hexdigest()
          Path("full-history-v1.0.0.index.json.sha256").write_text(
              f"{checksum}  {output.name}\n", encoding="utf-8"
          )
          Path(os.environ["RUNNER_TEMP"]).joinpath("index-summary.json").write_text(
              json.dumps(
                  {
                      "index_sha256": checksum,
                      "pipeline_version": index["pipeline_version"],
                      "repository_commit": index["repository_commit"],
                      "totals": index["totals"],
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload the index, verify the complete asset set, and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            full-history-v1.0.0.index.json \
            full-history-v1.0.0.index.json.sha256 \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets,isDraft,targetCommitish,url \
            > "$RUNNER_TEMP/release-before-publication.json"

          python - <<'PY'
          from pathlib import Path
          import json
          import os

          release = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "release-before-publication.json").read_text(
                  encoding="utf-8"
              )
          )
          names = {asset["name"] for asset in release["assets"]}
          expected = {f"market-data-{year}-v1.0.0.zip" for year in range(2017, 2027)} | {
              "full-history-v1.0.0.index.json",
              "full-history-v1.0.0.index.json.sha256",
          }
          missing = sorted(expected - names)
          if missing:
              raise SystemExit(f"release assets missing before publication: {missing}")
          if len(expected) != 12:
              raise SystemExit("unexpected required release asset count")
          print(sorted(names))
          PY

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --draft=false \
            --latest=false

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets,isDraft,targetCommitish,url,tagName \
            > "$RUNNER_TEMP/release-published.json"

      - name: Commit the publication attestation to main
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import UTC, datetime
          from pathlib import Path
          import json
          import os

          temp = Path(os.environ["RUNNER_TEMP"])
          release = json.loads((temp / "release-published.json").read_text(encoding="utf-8"))
          summary = json.loads((temp / "index-summary.json").read_text(encoding="utf-8"))
          if release["isDraft"]:
              raise SystemExit("release remains a draft after publication")
          if release["targetCommitish"] != os.environ["SOURCE_COMMIT"]:
              raise SystemExit(
                  f"published release target mismatch: {release['targetCommitish']}"
              )
          payload = {
              "schema_version": "1.0",
              "release_id": os.environ["RELEASE_ID"],
              "tag": release["tagName"],
              "status": "published",
              "release_url": release["url"],
              "release_target": release["targetCommitish"],
              "source_build_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_build_run_url": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                  f"{os.environ['SOURCE_RUN_ID']}"
              ),
              "publication_workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "publication_workflow_run_url": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}"
              ),
              "published_at_utc": datetime.now(UTC).isoformat(),
              "asset_count": len(release["assets"]),
              **summary,
              "google_drive_required": False,
              "exchange_download_required_for_researchers": False,
          }
          (temp / "published.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p "$(dirname "$STATUS_PATH")"
          cp "$RUNNER_TEMP/published.json" "$STATUS_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATUS_PATH"
          git commit -m "attest the full-history release is published"
          git push origin HEAD:main
