# One-shot observer; remove after recording final verification.
name: observe-post-cleanup-distribution-verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/observe-post-cleanup-build.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    env:
      VERIFY_WORKFLOW: verify-published-distribution.yml
      NOT_BEFORE: "2026-08-02T07:50:50Z"
      STATUS_PATH: data/distributions/post-cleanup-verification-observation.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture the post-publication verification run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=false
          for _ in $(seq 1 60); do
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$VERIFY_WORKFLOW" \
              --branch main \
              --limit 20 \
              --json databaseId,name,workflowName,event,status,conclusion,headSha,headBranch,createdAt,updatedAt,url \
              > "$RUNNER_TEMP/runs.json"
            python - <<'PY'
          from pathlib import Path
          import json
          import os

          runs = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "runs.json").read_text(encoding="utf-8")
          )
          matches = sorted(
              (run for run in runs if run.get("createdAt", "") >= os.environ["NOT_BEFORE"]),
              key=lambda run: run.get("createdAt", ""),
              reverse=True,
          )
          output = Path(os.environ["RUNNER_TEMP"]) / "observation.json"
          output.write_text(json.dumps(matches[:1], indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
            if python - <<'PY'
          from pathlib import Path
          import json
          import os

          payload = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "observation.json").read_text(encoding="utf-8")
          )
          raise SystemExit(0 if payload else 1)
          PY
            then
              found=true
              break
            fi
            sleep 5
          done
          test "$found" = true
          cat "$RUNNER_TEMP/observation.json"
      - name: Commit observation
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p "$(dirname "$STATUS_PATH")"
          cp "$RUNNER_TEMP/observation.json" "$STATUS_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATUS_PATH"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "record post-cleanup verification observation"
          git push origin HEAD:main
