name: discover-prioritized-canonicalization-run

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/discover-apply-run.yml

permissions:
  actions: read
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record latest apply run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow apply-canonicalization-now.yml \
            --limit 1 \
            --json databaseId,status,conclusion,headSha,url,createdAt,updatedAt \
            --jq '.[0]' > "$RUNNER_TEMP/run.json"
          test -s "$RUNNER_TEMP/run.json"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p data/distributions
          cp "$RUNNER_TEMP/run.json" data/distributions/canonicalization-apply.active-run.json
          rm .github/workflows/discover-apply-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "record prioritized canonicalization run"
          git push origin HEAD:main
