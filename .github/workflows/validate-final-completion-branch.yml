name: validate-final-completion-branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-final-completion-branch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VALIDATED_BRANCH: agent/final-completion
      STATUS_PATH: data/distributions/final-completion-branch.validation.json
      LOG_PATH: data/distributions/final-completion-branch.validation.log.txt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATED_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run repository and workflow validation
        run: |
          set +e
          : > "$RUNNER_TEMP/validation.log"

          python -m pip install -e '.[dev]' pyyaml >> "$RUNNER_TEMP/validation.log" 2>&1
          install_status=$?
          ruff format --check src tests scripts >> "$RUNNER_TEMP/validation.log" 2>&1
          format_status=$?
          ruff check src tests scripts >> "$RUNNER_TEMP/validation.log" 2>&1
          lint_status=$?
          pytest >> "$RUNNER_TEMP/validation.log" 2>&1
          test_status=$?
          python -m compileall -q src tests scripts >> "$RUNNER_TEMP/validation.log" 2>&1
          compile_status=$?
          python scripts/materialize_partition.py --help >> "$RUNNER_TEMP/validation.log" 2>&1
          cli_status=$?
          python - <<'PY' >> "$RUNNER_TEMP/validation.log" 2>&1
          from pathlib import Path
          import yaml

          paths = [
              Path('.github/workflows/build-full-history-release.yml'),
              Path('.github/workflows/verify-published-distribution.yml'),
          ]
          for path in paths:
              payload = yaml.safe_load(path.read_text(encoding='utf-8'))
              if not isinstance(payload, dict) or 'jobs' not in payload:
                  raise SystemExit(f'invalid workflow structure: {path}')
              print(f'parsed {path}')
          PY
          yaml_status=$?
          set -e

          export install_status format_status lint_status test_status compile_status cli_status yaml_status
          python - <<'PY'
          from datetime import UTC, datetime
          from pathlib import Path
          import json
          import os
          import subprocess

          checks = {
              name: int(os.environ[name])
              for name in (
                  'install_status',
                  'format_status',
                  'lint_status',
                  'test_status',
                  'compile_status',
                  'cli_status',
                  'yaml_status',
              )
          }
          payload = {
              'schema_version': '1.0',
              'status': 'validated' if all(value == 0 for value in checks.values()) else 'failed',
              'branch': os.environ['VALIDATED_BRANCH'],
              'head_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'validated_at_utc': datetime.now(UTC).isoformat(),
              'checks': checks,
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_url': (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}"
              ),
          }
          Path(os.environ['RUNNER_TEMP']).joinpath('validation.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Record validation result on main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p "$(dirname "$STATUS_PATH")"
          cp "$RUNNER_TEMP/validation.json" "$STATUS_PATH"
          cp "$RUNNER_TEMP/validation.log" "$LOG_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATUS_PATH" "$LOG_PATH"
          git commit -m "record final completion branch validation"
          git push origin HEAD:main
