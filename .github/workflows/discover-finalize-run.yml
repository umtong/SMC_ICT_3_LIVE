name: discover-final-pipeline-validation-run

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/discover-finalize-run.yml

permissions:
  actions: read
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record latest finalization run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow finalize-full-history-pipeline.yml \
              --limit 1 \
              --json databaseId,status,conclusion,headSha,url,createdAt,updatedAt \
              --jq '.[0] // empty' > "$RUNNER_TEMP/run.json" || true
            [[ -s "$RUNNER_TEMP/run.json" ]] && break
            sleep 5
          done
          [[ -s "$RUNNER_TEMP/run.json" ]]
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p data/distributions
          cp "$RUNNER_TEMP/run.json" data/distributions/finalize-pipeline.active-run.json
          rm .github/workflows/discover-finalize-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "record final pipeline validation run"
          git push origin HEAD:main
