name: apply-canonicalization-now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-canonicalization-now.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-history-market-data-v1
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Reuse the reviewed integration transformation
        run: |
          set -euo pipefail
          awk '
            /          python - <<.PY./ {capture=1; next}
            capture && /^          PY$/ {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/integrate-historical-canonicalization.yml \
            > "$RUNNER_TEMP/integrate.py"
          test -s "$RUNNER_TEMP/integrate.py"
          python "$RUNNER_TEMP/integrate.py"
      - name: Format, lint, test and compile
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          ruff format src tests scripts
          ruff check src tests scripts
          pytest
          python -m compileall -q src tests scripts
      - name: Publish validated integration
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-canonicalization-now.yml \
            .github/workflows/integrate-historical-canonicalization.yml \
            .github/workflows/discover-canonicalization-run.yml \
            .github/workflows/observe-canonicalization-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Canonicalize anomalous historical klines without fabricating bars"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
