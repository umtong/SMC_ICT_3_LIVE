name: data-contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: ruff check src tests
      - run: pytest
      - name: Verify committed research-ready release
        run: |
          if [[ -f data/prepared/CURRENT ]]; then
            smc-data ready --verify
          else
            echo "Prepared release pending one-shot bootstrap on this PR."
          fi
      - name: Rebuild golden source manifest
        run: |
          smc-data plan \
            --start 2024-01-01 \
            --end 2024-01-31 \
            --as-of 2024-02-12 \
            --out /tmp/golden.csv
          diff -u data/manifests/golden_2024_01.csv /tmp/golden.csv
