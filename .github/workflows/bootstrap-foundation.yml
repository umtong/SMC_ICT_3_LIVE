name: bootstrap-foundation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: write

jobs:
  expand:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Expand reviewed source bundle
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          PARTS=(bootstrap/foundation.tar.gz.b64.part-*)
          if [[ ${#PARTS[@]} -eq 0 ]]; then
            echo "bundle already expanded"
            exit 0
          fi
          cat "${PARTS[@]}" | base64 --decode > /tmp/foundation.tar.gz
          ACTUAL=$(sha256sum /tmp/foundation.tar.gz | awk '{print $1}')
          EXPECTED=5fe2bd9b53df7376a059e01041557bc48777f4f9f711412d58df7aec296378f3
          test "$ACTUAL" = "$EXPECTED"
          tar -xzf /tmp/foundation.tar.gz
          rm -rf bootstrap .github/workflows/bootstrap-foundation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build reproducible market data foundation"
          git push origin "HEAD:${{ github.head_ref }}"
