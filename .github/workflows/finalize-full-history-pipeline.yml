name: finalize-full-history-publication-pipeline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-full-history-pipeline.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-history-market-data-v1
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply the reviewed deterministic patch
        run: python scripts/_finalize_full_history_pipeline.py
      - name: Load the repository-local materializer explicitly in its test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_materialize_partition.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "from scripts.materialize_partition import resample_partition\n"
              "from smc_ict_data.normalization import KLINE_OUTPUT_COLUMNS\n"
          )
          new = """from smc_ict_data.normalization import KLINE_OUTPUT_COLUMNS
          import importlib.util
          import sys


          MODULE_PATH = Path(__file__).resolve().parents[1] / "scripts" / "materialize_partition.py"
          SPEC = importlib.util.spec_from_file_location(
              "smc_ict_materialize_partition_test_module",
              MODULE_PATH,
          )
          assert SPEC is not None and SPEC.loader is not None
          MODULE = importlib.util.module_from_spec(SPEC)
          sys.modules[SPEC.name] = MODULE
          SPEC.loader.exec_module(MODULE)
          resample_partition = MODULE.resample_partition
          """
          if text.count(old) != 1:
              raise SystemExit("materializer import marker mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Format, lint, test and compile
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          ruff format src tests scripts
          ruff check src tests scripts
          pytest
          python -m compileall -q src tests scripts
          python scripts/materialize_partition.py --help >/dev/null
      - name: Publish the validated pipeline
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/finalize-full-history-pipeline.yml \
            scripts/_finalize_full_history_pipeline.py \
            data/distributions/finalize-pipeline.active-run.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize and pin the full-history GitHub distribution"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
