name: finalize-full-history-publication-pipeline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-full-history-pipeline.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-history-market-data-v1
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Parallelize deterministic Gold derivation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one replacement in {path}: found {count}; marker={old[:100]!r}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")


          path = Path("scripts/materialize_partition.py")
          replace_once(
              path,
              "from collections import Counter\nfrom pathlib import Path\n",
              "from collections import Counter\n"
              "from concurrent.futures import ThreadPoolExecutor, as_completed\n"
              "from pathlib import Path\n",
          )
          replace_once(
              path,
              "    parser.add_argument(\"--repository-commit\", required=True)\n"
              "    parser.add_argument(\"--force\", action=\"store_true\")\n",
              "    parser.add_argument(\"--repository-commit\", required=True)\n"
              "    parser.add_argument(\"--resample-workers\", type=int, default=4)\n"
              "    parser.add_argument(\"--force\", action=\"store_true\")\n",
          )
          marker = "\ndef make_catalog_portable(catalog: Path) -> None:\n"
          helper = r'''

def resample_partition(
    silver_root: Path,
    gold_root: Path,
    quality_root: Path,
    *,
    workers: int,
    targets: tuple[str, ...] = TARGET_INTERVALS,
) -> int:
    if workers < 1:
        raise ValueError("resample workers must be positive")

    jobs: list[tuple[Path, str, Path, Path]] = []
    for source in sorted(silver_root.rglob("*.csv.gz")):
        for target in targets:
            destination, report = derived_paths(
                source,
                silver_root,
                gold_root,
                quality_root,
                target,
            )
            jobs.append((source, target, destination, report))

    if not jobs:
        return 0

    def run(job: tuple[Path, str, Path, Path]) -> None:
        source, target, destination, report = job
        resample_file(
            source,
            destination,
            report,
            target_interval=target,
        )

    with ThreadPoolExecutor(max_workers=min(workers, len(jobs))) as executor:
        futures = {executor.submit(run, job): job for job in jobs}
        for future in as_completed(futures):
            source, target, _, _ = futures[future]
            try:
                future.result()
            except Exception as exc:
                raise RuntimeError(
                    f"failed to derive {target} from {source.as_posix()}"
                ) from exc
    return len(jobs)

'''
          text = path.read_text(encoding="utf-8")
          if text.count(marker) != 1:
              raise SystemExit("materializer helper insertion marker mismatch")
          path.write_text(text.replace(marker, helper + marker, 1), encoding="utf-8")
          replace_once(
              path,
              "    normalization_quality = summarize_normalization_quality(normalization)\n"
              "    for source in sorted(silver_root.rglob(\"*.csv.gz\")):\n"
              "        for target in TARGET_INTERVALS:\n"
              "            destination, report = derived_paths(\n"
              "                source,\n"
              "                silver_root,\n"
              "                gold_root,\n"
              "                partition_quality,\n"
              "                target,\n"
              "            )\n"
              "            resample_file(source, destination, report, target_interval=target)\n",
              "    normalization_quality = summarize_normalization_quality(normalization)\n"
              "    resample_jobs = resample_partition(\n"
              "        silver_root,\n"
              "        gold_root,\n"
              "        partition_quality,\n"
              "        workers=args.resample_workers,\n"
              "    )\n",
          )
          replace_once(
              path,
              "        \"pipeline_version\": PIPELINE_VERSION,\n"
              "        \"repository_commit\": args.repository_commit,\n",
              "        \"pipeline_version\": PIPELINE_VERSION,\n"
              "        \"repository_commit\": args.repository_commit,\n"
              "        \"resample_jobs\": resample_jobs,\n"
              "        \"resample_workers\": args.resample_workers,\n",
          )
          PY

      - name: Harden immutable Release identity and index lineage
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one replacement in {path}: found {count}; marker={old[:100]!r}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")


          path = Path(".github/workflows/build-full-history-release.yml")
          replace_once(path, "  cancel-in-progress: false\n", "  cancel-in-progress: true\n")
          replace_once(
              path,
              "            --period-utc \"$PERIOD\" \\\n"
              "            --repository-commit \"$GITHUB_SHA\"\n",
              "            --period-utc \"$PERIOD\" \\\n"
              "            --repository-commit \"$GITHUB_SHA\" \\\n"
              "            --resample-workers 4\n",
          )
          replace_once(
              path,
              "              \"catalog_sha256\": metadata[\"catalog_sha256\"],\n"
              "              \"download_statuses\": metadata[\"download_statuses\"],\n",
              "              \"catalog_sha256\": metadata[\"catalog_sha256\"],\n"
              "              \"download_statuses\": metadata[\"download_statuses\"],\n"
              "              \"pipeline_version\": metadata[\"pipeline_version\"],\n"
              "              \"repository_commit\": metadata[\"repository_commit\"],\n",
          )
          replace_once(
              path,
              "          index = {\n"
              "              \"schema_version\": \"1.0\",\n",
              "          pipeline_versions = sorted({asset[\"pipeline_version\"] for asset in assets})\n"
              "          repository_commits = sorted({asset[\"repository_commit\"] for asset in assets})\n"
              "          if len(pipeline_versions) != 1:\n"
              "              raise SystemExit(f\"mixed pipeline versions: {pipeline_versions}\")\n"
              "          if repository_commits != [os.environ[\"GITHUB_SHA\"]]:\n"
              "              raise SystemExit(\n"
              "                  f\"partition commit mismatch: expected={os.environ['GITHUB_SHA']}, \"\n"
              "                  f\"actual={repository_commits}\"\n"
              "              )\n\n"
              "          index = {\n"
              "              \"schema_version\": \"1.0\",\n"
              "              \"pipeline_version\": pipeline_versions[0],\n"
              "              \"repository_commit\": repository_commits[0],\n",
          )
          replace_once(
              path,
              "          gh release edit \"$RELEASE_TAG\" --draft=false --latest=false\n",
              "          gh release edit \"$RELEASE_TAG\" \\\n"
              "            --target \"$GITHUB_SHA\" \\\n"
              "            --draft=false \\\n"
              "            --latest=false\n",
          )
          PY

      - name: Add a concurrent materialization contract test
        run: |
          set -euo pipefail
          cat > tests/test_materialize_partition.py <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import csv
          import gzip

          import pytest

          from scripts.materialize_partition import resample_partition
          from smc_ict_data.normalization import KLINE_OUTPUT_COLUMNS


          START_US = 1_704_067_200_000_000


          def write_silver(path: Path, *, symbol: str) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              with gzip.open(path, "wt", encoding="utf-8", newline="") as handle:
                  writer = csv.DictWriter(handle, fieldnames=KLINE_OUTPUT_COLUMNS, lineterminator="\n")
                  writer.writeheader()
                  for index in range(10):
                      open_time = START_US + index * 60_000_000
                      writer.writerow(
                          {
                              "exchange": "binance",
                              "market_path": "spot",
                              "dataset": "klines",
                              "dataset_kind": "kline",
                              "symbol": symbol,
                              "interval": "1m",
                              "open_time_us": open_time,
                              "close_time_exclusive_us": open_time + 60_000_000,
                              "available_time_us": open_time + 60_000_000,
                              "source_close_time_us": open_time + 59_999_000,
                              "open": str(100 + index),
                              "high": str(101 + index),
                              "low": str(99 + index),
                              "close": str(100.5 + index),
                              "base_volume": "1",
                              "quote_volume": "100",
                              "trade_count": "1",
                              "taker_buy_base_volume": "0.5",
                              "taker_buy_quote_volume": "50",
                              "source_field_5": "1",
                              "source_field_7": "100",
                              "source_field_8": "1",
                              "source_field_9": "0.5",
                              "source_field_10": "50",
                              "source_field_11": "0",
                              "source_url": "https://example.invalid/source.zip",
                              "source_sha256": "0" * 64,
                              "archive_id": f"test-{symbol}",
                              "pipeline_version": "test",
                          }
                      )


          def test_parallel_partition_resampling_is_complete_and_deterministic(tmp_path: Path) -> None:
              silver = tmp_path / "silver"
              gold = tmp_path / "gold"
              quality = tmp_path / "quality"
              for symbol in ("BTCUSDT", "ETHUSDT"):
                  write_silver(
                      silver
                      / "binance"
                      / "spot"
                      / "klines"
                      / symbol
                      / "1m"
                      / "2024"
                      / "01"
                      / f"{symbol}-1m-2024-01.csv.gz",
                      symbol=symbol,
                  )

              jobs = resample_partition(
                  silver,
                  gold,
                  quality,
                  workers=2,
                  targets=("5m",),
              )

              assert jobs == 2
              outputs = sorted(gold.rglob("*.csv.gz"))
              reports = sorted(quality.rglob("*.quality.json"))
              assert len(outputs) == 2
              assert len(reports) == 2
              for output in outputs:
                  with gzip.open(output, "rt", encoding="utf-8", newline="") as handle:
                      assert len(list(csv.DictReader(handle))) == 2


          def test_resampling_rejects_nonpositive_worker_count(tmp_path: Path) -> None:
              with pytest.raises(ValueError, match="workers must be positive"):
                  resample_partition(
                      tmp_path / "silver",
                      tmp_path / "gold",
                      tmp_path / "quality",
                      workers=0,
                      targets=("5m",),
                  )
          PY

      - name: Format, lint, test and compile
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          ruff format src tests scripts
          ruff check src tests scripts
          pytest
          python -m compileall -q src tests scripts
          python scripts/materialize_partition.py --help >/dev/null

      - name: Publish validated pipeline and trigger only the final rebuild
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-full-history-pipeline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize and pin the full-history GitHub distribution"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
