name: discover-canonicalization-run

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/discover-canonicalization-run.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Discover latest integration run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow integrate-historical-kline-canonicalization \
              --limit 1 \
              --json databaseId,status,conclusion,headSha,url,createdAt,updatedAt \
              --jq '.[0] // empty' > "$RUNNER_TEMP/run.json" || true
            [[ -s "$RUNNER_TEMP/run.json" ]] && break
            sleep 5
          done
          [[ -s "$RUNNER_TEMP/run.json" ]]
          python - <<'PY'
          from datetime import UTC, datetime
          from pathlib import Path
          import json
          import os

          path = Path(os.environ["RUNNER_TEMP"]) / "run.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload.update({
              "schema_version": "1.0",
              "component": "historical-kline-canonicalization",
              "observed_at_utc": datetime.now(UTC).isoformat(),
          })
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Record discovery
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p data/distributions
          cp "$RUNNER_TEMP/run.json" data/distributions/canonicalization-integration.active-run.json
          rm .github/workflows/discover-canonicalization-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "record active canonicalization integration run"
          git push origin HEAD:main
