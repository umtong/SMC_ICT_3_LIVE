name: supervise-final-distribution-verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/supervise-final-distribution-verification.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: supervise-final-distribution-verification
  cancel-in-progress: true

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      VERIFY_WORKFLOW: verify-published-distribution.yml
      STATUS_PATH: data/distributions/full-history-v1.0.0.verification-supervised.json
      LOG_PATH: data/distributions/full-history-v1.0.0.verification-supervised.log.txt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Dispatch and watch the all-partition verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before_id="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$VERIFY_WORKFLOW" \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // 0'
          )"
          gh workflow run "$VERIFY_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main

          run_id=""
          for _ in $(seq 1 90); do
            candidate="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$VERIFY_WORKFLOW" \
                --event workflow_dispatch \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // 0'
            )"
            if [[ "$candidate" != "0" && "$candidate" != "$before_id" ]]; then
              run_id="$candidate"
              break
            fi
            sleep 4
          done
          [[ -n "$run_id" ]]
          echo "VERIFY_RUN_ID=$run_id" >> "$GITHUB_ENV"

          set +e
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          watch_status=$?
          set -e
          echo "VERIFY_WATCH_STATUS=$watch_status" >> "$GITHUB_ENV"

          gh run view "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,name,workflowName,event,status,conclusion,headSha,headBranch,createdAt,updatedAt,url,jobs \
            > "$RUNNER_TEMP/verification-run.json"
          gh run view "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --log-failed \
            > "$RUNNER_TEMP/verification-run.log" 2>&1 || true

      - name: Record the verification result on main
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import UTC, datetime
          from pathlib import Path
          import json
          import os

          source = Path(os.environ["RUNNER_TEMP"]) / "verification-run.json"
          payload = json.loads(source.read_text(encoding="utf-8"))
          payload.update(
              {
                  "schema_version": "1.0",
                  "component": "full-history-distribution-verification",
                  "release_id": "full-history-v1.0.0",
                  "observed_at_utc": datetime.now(UTC).isoformat(),
                  "watch_exit_status": int(os.environ["VERIFY_WATCH_STATUS"]),
              }
          )
          Path(os.environ["RUNNER_TEMP"]).joinpath("verification-supervised.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p "$(dirname "$STATUS_PATH")"
          cp "$RUNNER_TEMP/verification-supervised.json" "$STATUS_PATH"
          cp "$RUNNER_TEMP/verification-run.log" "$LOG_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATUS_PATH" "$LOG_PATH"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "record supervised full-history verification result"
          git push origin HEAD:main
